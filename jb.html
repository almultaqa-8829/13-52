    html,

        sans-serif;

    /* صورة الخلفية */
    body {
      background-image:
        linear-gradient(

          rgba(5, 7, 10, 0.58)

        var(--bg-image);

      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    #brand {
      text-align: center;
      padding: 8px 10px;
      background: rgba(14, 17, 22, 0.90);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    #brand img {
      width: 28px;
      height: 28px;
      margin-right: 8px;
      border-radius: 50%;
      vertical-align: middle;
    }

    #brand b {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: var(--title);
      vertical-align: middle;
    }

    /* Spinner */
    #spin {
      position: fixed;
      top: calc(50% + 20px);
      left: 50%;
      width: 46px;
      height: 46px;
      margin: -23px 0 0 -23px;
      border: 4px solid var(--border);
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      box-shadow: 0 0 20px rgba(127, 208, 160, 0.15);
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    #msg {
      position: fixed;
      top: 50%;
      left: 0;
      right: 0;
      transform: translateY(-50%);
      text-align: center;
      font-size: 16px;
      letter-spacing: 0.5px;
      display: none;
    }

    #wrap {
      padding: 0;
    }

    #state,
    #out {
      display: none;
    }

    body.done #spin {
      display: none;
    }

    body.fail #spin {
      display: none;
    }

    body.fail #msg {
      display: block;
    }

    /* ?log=1 */
    body.log #spin,
    body.log #msg {
      display: none;
    }

    body.log #wrap {
      padding: 14px 18px;
    }

    body.log #state {
      display: block;
      font-size: 22px;
      font-weight: 700;
      margin: 0 0 8px;
      color: var(--title);
    }

    }
